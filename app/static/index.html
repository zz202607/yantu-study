<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<meta name="theme-color" content="#0f2a3f">
<title>岩土错题本 · 查题</title>
<style>
  :root {
    --ink: #14212b;
    --muted: #5b6b78;
    --line: #dbe3e8;
    --paper: #f6f8f9;
    --card: #ffffff;
    --accent: #1667d9;
    --accent-ink: #ffffff;
    --good: #1d7a4f;
    --warn: #a35a00;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: #0f2a3f; color: #fff;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em;
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  header .badge { font-size: 11px; opacity: .7; border: 1px solid rgba(255,255,255,.35); padding: 1px 6px; border-radius: 999px; }
  .nav {
    display: flex; gap: 3px; flex: 0 0 auto;
    background: rgba(255,255,255,.12); border-radius: 9px; padding: 3px;
  }
  .nav button {
    border: 0; background: transparent; color: #cfe3f2;
    font-size: 13px; padding: 6px 11px; border-radius: 7px; font-family: inherit;
  }
  .nav button.on { background: #fff; color: #0f2a3f; font-weight: 600; }
  select {
    flex: 0 0 auto;
    background: #16374f; color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 8px; padding: 6px 8px; font-size: 13px;
  }
  main { padding: 14px; max-width: 760px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  .shot {
    display: block; width: 100%;
    border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink);
    font-size: 18px; font-weight: 600; padding: 22px;
    text-align: center;
  }
  .shot small { display: block; font-weight: 400; font-size: 12px; opacity: .75; margin-top: 4px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  input[type=text] {
    flex: 1 1 auto; min-width: 0; font-size: 16px; padding: 12px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  input[type=text]:focus { outline: 2px solid rgba(22,103,217,.25); border-color: var(--accent); }
  button.ghost, a.ghost {
    background: #fff; color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; font-size: 15px;
    text-decoration: none; display: inline-block;
  }
  button.ghost:active, a.ghost:active { background: var(--paper); }
  .hint { color: var(--muted); font-size: 12.5px; }
  .muted { color: var(--muted); }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; }
  .thumb {
    flex: 0 0 auto; max-height: 120px; border-radius: 8px; border: 1px solid var(--line);
  }
  .candidates { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .cand {
    position: relative;
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    border: 1px solid var(--line); background: #fff; border-radius: 12px;
    padding: 10px 26px 10px 14px; min-width: 96px; text-align: left;
  }
  .cand b { font-size: 18px; letter-spacing: .02em; }
  .cand span { font-size: 11px; color: var(--muted); }
  .cand.top { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(22,103,217,.12); }
  .cand .tag { color: var(--warn); }
  .cand.on { border-color: var(--accent); background: rgba(22,103,217,.07); }
  .cand .tick {
    position: absolute; top: 9px; right: 9px;
    width: 15px; height: 15px; border-radius: 50%;
    border: 1.5px solid var(--line); background: #fff;
    font-size: 10px; line-height: 15px; text-align: center;
    color: transparent;
  }
  .cand.on .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary {
    background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 10px; padding: 10px 16px; font-size: 15px; font-weight: 600;
  }
  button.primary:disabled { opacity: .4; }
  button.ghost.small { padding: 8px 11px; font-size: 13.5px; }
  .toolbar.wrap { flex-wrap: wrap; }
  .viewer-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .viewer-head h2 {
    font-size: 18px; margin: 0; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .viewer-head .pos { flex: 0 0 auto; font-size: 13px; color: var(--muted); }
  .tabs {
    display: flex; flex: 0 0 auto; background: var(--paper); border-radius: 10px;
    padding: 3px; border: 1px solid var(--line);
  }
  .tabs button {
    border: 0; background: transparent; padding: 7px 12px; border-radius: 8px;
    font-size: 14px; color: var(--muted);
  }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .paper-wrap {
    border: 1px solid var(--line); border-radius: 12px; background: #fff;
    overflow: auto; max-height: 75vh;
  }
  .paper-wrap img { display: block; width: 100%; height: auto; }
  .paper-wrap.zoom img { width: 200%; max-width: none; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
  .toolbar .grow { flex: 1; }
  .toolbar button { flex: 0 0 auto; }
  /* Four buttons + a page counter have to share one line on a 390 px phone. */
  #viewer .toolbar { gap: 6px; }
  #viewer .toolbar .ghost { padding: 9px 11px; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #14212b; color: #fff; padding: 10px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
    z-index: 30;
  }
  .toast.show { opacity: .95; }
  .hidden { display: none !important; }

  /* wrong book */
  .book-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .book-head h2 { font-size: 17px; margin: 0; flex: 1; min-width: 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .filters select {
    flex: 0 0 auto; background: #fff; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 11px; font-size: 13px; font-family: inherit;
  }
  .chip.on { border-color: var(--accent); background: rgba(22,103,217,.08); color: var(--accent); font-weight: 600; }
  .chip .n { color: var(--muted); font-size: 11px; margin-left: 3px; }
  .chip.on .n { color: inherit; }
  .item {
    display: flex; gap: 10px; width: 100%; text-align: left; align-items: flex-start;
    border: 0; border-bottom: 1px solid var(--line); background: transparent;
    padding: 11px 2px; font-family: inherit;
  }
  .item:active { background: var(--paper); }
  .item .main { flex: 1; min-width: 0; }
  .item .qid { font-weight: 700; font-size: 15.5px; letter-spacing: .01em; }
  .item .meta {
    color: var(--muted); font-size: 12px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mini {
    width: 54px; height: 40px; object-fit: cover;
    border-radius: 6px; border: 1px solid var(--line); flex: 0 0 auto; background: var(--paper);
  }
  .tagmini {
    display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 5px;
    background: rgba(163,90,0,.1); color: var(--warn); margin-left: 5px; font-weight: 400;
  }
  .mastered .qid { color: var(--good); }
  .empty { color: var(--muted); text-align: center; padding: 26px 0; font-size: 14px; }
  .badge2 {
    font-size: 11px; color: var(--warn); border: 1px solid rgba(163,90,0,.3);
    background: rgba(163,90,0,.07); padding: 1px 7px; border-radius: 999px;
    flex: 0 0 auto;
  }
  .photo { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .photo img { display: block; width: 100%; height: auto; max-height: 60vh; object-fit: contain; }
  .danger { color: #b3261e; border-color: #e7c3c0; }
  textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font-size: 15px; font-family: inherit; resize: vertical;
    color: var(--ink); background: #fff;
  }
  textarea:focus { outline: 2px solid rgba(22,103,217,.25); border-color: var(--accent); }
  .sheet {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(15,42,63,.45);
    display: flex; align-items: flex-end;
  }
  .sheet-panel {
    background: #fff; width: 100%; max-width: 760px; margin: 0 auto;
    border-radius: 16px 16px 0 0; padding: 16px 16px 22px;
  }
  .sheet-panel h3 { margin: 0; font-size: 17px; }
  .sheet-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 12px; }
  .sheet-actions .primary { flex: 1; padding: 12px; }
  .sheet-actions .ghost { flex: 0 0 auto; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-top: 10px; }
  .detail-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .detail-head h2 { font-size: 18px; margin: 0; }
  .suggest {
    margin: 10px 0 4px; border: 1px dashed var(--line); border-radius: 12px;
    padding: 10px 12px; background: var(--paper);
  }
  .suggest-head { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .suggest-head .hint { font-weight: 400; font-size: 11.5px; }
  .suggest-cite { font-size: 12.5px; line-height: 1.55; margin-top: 5px; }
  .suggest .chip { background: #fff; font-size: 12.5px; padding: 5px 10px; }
  .suggest-evidence { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 3px; }
  .suggest-note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .import-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .import-row input { margin-top: 5px; width: 18px; height: 18px; flex: 0 0 auto; }
  .import-row .main { flex: 1; min-width: 0; font-size: 13.5px; }
  .import-row .name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ok { color: var(--good); }
  .warn { color: var(--warn); }

  /* review */
  .review-cta {
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: 0; border-radius: 14px; padding: 16px 18px; margin-bottom: 14px;
    background: linear-gradient(135deg, #0f2a3f, #1667d9);
    color: #fff; font-family: inherit;
  }
  .review-cta span { display: block; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  .review-cta small { display: block; margin-top: 4px; font-size: 12.5px; opacity: .8; }
  .review-paper { max-height: 62vh; }
  .answer-label {
    margin: 14px 0 6px; font-size: 12px; font-weight: 600;
    color: var(--muted); letter-spacing: .05em;
  }
  .review-bar {
    position: sticky; bottom: 0; z-index: 4;
    display: flex; gap: 10px; padding: 12px 0 6px;
    background: linear-gradient(rgba(255,255,255,0), var(--card) 42%);
  }
  .review-bar .big {
    flex: 1; padding: 15px 10px; font-size: 17px; border-radius: 12px;
  }
  .review-tools { margin-top: 4px; }
  .summary-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .summary-grid div {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 11px; padding: 10px 6px; text-align: center;
  }
  .summary-grid b { display: block; font-size: 22px; line-height: 1.2; }
  .summary-grid span { font-size: 11.5px; color: var(--muted); }
  .summary-block { margin-top: 14px; }
  .summary-block h3 { font-size: 13px; margin: 0 0 4px; color: var(--muted); font-weight: 600; }
  .summary-block p { margin: 0; font-size: 14.5px; }
  .encourage { background: rgba(29,122,79,.07); border-radius: 12px; padding: 12px; }
  .encourage h3 { color: var(--good); }
  .print-options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .print-opt {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    text-align: left; border: 1px solid var(--line); background: #fff;
    border-radius: 12px; padding: 12px 14px; font-family: inherit; font-size: 15px;
    color: var(--ink);
  }
  .print-opt span { color: var(--muted); font-size: 12px; flex: 0 0 auto; }
  @media (max-width: 520px) {
    header { padding: 9px 12px; gap: 6px; }
    header h1 { font-size: 15px; }
    header .badge { display: none; }
    .nav button { padding: 6px 9px; font-size: 13px; }
    select { padding: 6px 6px; font-size: 12.5px; }
  }
  @media (max-width: 380px) {
    .nav button { padding: 6px 7px; font-size: 12px; }
    .cand { min-width: 84px; padding: 9px 11px; }
  }
</style>
</head>
<body>
<header>
  <h1>岩土错题本 <span class="badge">M3</span></h1>
  <nav class="nav">
    <button id="navLook" class="on" type="button">查题</button>
    <button id="navBook" type="button">错题本</button>
    <button id="navReview" type="button">复习</button>
  </nav>
  <select id="family" aria-label="当前册别">
    <option value="C">案例 C</option>
    <option value="Z">知识 Z</option>
  </select>
</header>

<main>
  <!-- 1. capture -->
  <section id="home" class="card">
    <button id="startReview" type="button" class="review-cta">
      <span id="reviewCtaTitle">今日复习</span>
      <small id="reviewCtaHint">正在统计…</small>
    </button>
    <label class="shot" for="camera">
      拍照识题号
      <small>拍题号那几行即可 · 不用改名</small>
    </label>
    <input id="camera" type="file" accept="image/*" capture="environment" class="hidden">
    <div class="toolbar">
      <input id="manual" type="text" inputmode="text" placeholder="手输题号，如 3-11" autocomplete="off">
      <button id="go" class="ghost">查</button>
    </div>
    <p class="hint">当前册：<b id="familyName">案例习题集</b> · 题号按「篇-题」，跨册同号时以当前册为准。</p>
  </section>

  <!-- 2. recognizing / candidates -->
  <section id="pick" class="card hidden">
    <div class="thumbs"><img id="preview" class="thumb" alt="刚拍的照片"></div>
    <div id="busy" class="status"><span class="spinner"></span><span id="busyText">识别中…</span></div>
    <div id="pickBody" class="hidden">
      <div class="status" id="pickMeta"></div>
      <div class="candidates" id="candidates"></div>
      <div class="toolbar wrap">
        <button id="selectAll" class="ghost small">全选</button>
        <button id="clearSel" class="ghost small">清空</button>
        <button id="markSel" class="ghost small" disabled>记错</button>
        <span class="grow"></span>
        <button id="openSel" class="primary" disabled>查看所选</button>
      </div>
      <div class="toolbar">
        <input id="manual2" type="text" placeholder="都不对？手输题号" autocomplete="off">
        <button id="go2" class="ghost">查</button>
        <button id="retry" class="ghost">重拍</button>
      </div>
    </div>
  </section>

  <!-- 3. viewer -->
  <section id="viewer" class="card hidden">
    <div class="viewer-head">
      <h2 id="qidTitle">—</h2>
      <span id="wrongBadge" class="badge2 hidden"></span>
      <span id="pos" class="pos"></span>
      <div class="tabs">
        <button id="tabQ" class="on">题面</button>
        <button id="tabA">解析</button>
      </div>
    </div>
    <div class="toolbar wrap">
      <button id="prev" class="ghost hidden">‹ 上一题</button>
      <button id="next" class="ghost hidden">下一题 ›</button>
      <span class="grow"></span>
      <button id="markOne" class="ghost">记错</button>
      <button id="zoom" class="ghost">放大</button>
      <button id="back" class="ghost">回候选</button>
      <button id="again" class="ghost">再拍</button>
    </div>
    <div id="paperWrap" class="paper-wrap"><img id="paper" alt="题目"></div>
    <p class="hint" id="viewerHint"></p>
  </section>

  <!-- 4. review -->
  <section id="review" class="card hidden">
    <div class="viewer-head">
      <h2 id="rQid">—</h2>
      <span id="rPos" class="pos"></span>
    </div>
    <p class="hint" id="rWhere"></p>
    <div class="paper-wrap review-paper"><img id="rPaper" alt="题面"></div>
    <p class="hint" id="rHint">先自己做一遍，再点「看答案」。</p>
    <div id="rAnswerWrap" class="hidden">
      <div class="answer-label">答案 / 解析</div>
      <div class="paper-wrap"><img id="rAnswer" alt="解析"></div>
    </div>
    <div id="rTagBox" class="chips hidden">
      <span class="hint" style="align-self:center">错因（选「没做对」时记录，可不选）</span>
    </div>
    <div class="review-bar">
      <button id="rShowAnswer" class="primary big">看答案</button>
      <button id="rWrong" class="ghost big danger hidden">没做对 (1)</button>
      <button id="rRight" class="ghost big hidden">做对了 (2)</button>
    </div>
    <div class="toolbar review-tools">
      <button id="rUndo" class="ghost small">撤销上一题</button>
      <button id="rSkip" class="ghost small">跳过</button>
      <span class="grow"></span>
      <button id="rExit" class="ghost small">退出</button>
    </div>
  </section>

  <!-- 5. review summary -->
  <section id="summary" class="card hidden">
    <div class="viewer-head">
      <h2>本轮复习完成</h2>
      <span id="sDay" class="pos"></span>
    </div>
    <div class="summary-grid">
      <div><b id="sDone">0</b><span>完成</span></div>
      <div><b id="sCorrect">0</b><span>做对</span></div>
      <div><b id="sWrong">0</b><span>做错</span></div>
      <div><b id="sAccuracy">—</b><span>正确率</span></div>
      <div><b id="sMinutes">0</b><span>分钟</span></div>
      <div><b id="sSkipped">0</b><span>跳过</span></div>
    </div>
    <div id="sMastered" class="summary-block hidden"></div>
    <div id="sStubborn" class="summary-block hidden"></div>
    <div class="summary-block">
      <h3>下一步</h3>
      <p id="sNext">—</p>
    </div>
    <div class="summary-block encourage">
      <h3>今天扎实的一点</h3>
      <p id="sEncourage">—</p>
    </div>
    <div class="toolbar wrap">
      <button id="sPrint" class="primary">打印这一卷</button>
      <button id="sAgain" class="ghost">再复习一轮</button>
      <button id="sHome" class="ghost">回首页</button>
    </div>
  </section>

  <!-- 6. wrong book -->
  <section id="book" class="card hidden">
    <div class="book-head">
      <h2>错题本</h2>
      <a class="ghost small" href="/api/backup">备份</a>
      <button id="openPrint" class="ghost small">打印卷</button>
      <button id="openImport" class="ghost small">导入旧照片</button>
    </div>
    <div class="filters">
      <select id="fFamily" aria-label="筛选册别">
        <option value="">全部册</option>
        <option value="C">案例 C</option>
        <option value="Z">知识 Z</option>
        <option value="A">真题 A</option>
        <option value="K">真题 K</option>
        <option value="M">模拟 M</option>
      </select>
      <select id="fChapter" aria-label="筛选篇" class="hidden"></select>
      <select id="fTime" aria-label="筛选时间">
        <option value="0">全部时间</option>
        <option value="7">最近 7 天</option>
        <option value="30">最近 30 天</option>
      </select>
      <select id="fStatus" aria-label="筛选掌握">
        <option value="">全部状态</option>
        <option value="active">未掌握</option>
        <option value="mastered">已掌握</option>
      </select>
    </div>
    <div class="chips" id="fTags"></div>
    <div class="status" id="bookMeta">—</div>
    <div id="bookList"></div>
    <button id="bookMore" class="ghost small hidden">加载更多</button>
  </section>

  <!-- 5. detail -->
  <section id="detail" class="card hidden">
    <div class="detail-head">

<div id="toast" class="toast"></div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h3 id="sheetTitle">记入错题本</h3>
      <span id="sheetCount" class="hint"></span>

<div id="printSheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="printTitle">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h3 id="printTitle">打印 A4 卷</h3>
      <span class="hint">题面与答案分开</span>
    </div>
    <p class="hint">默认按原尺寸排版，每题留手写区，答案单独成页。最多 30 题。</p>

      <button type="button" class="print-opt" data-scope="filter">
        <b>当前筛选</b><span id="printFilterCount">—</span>
      </button>
      <button type="button" class="print-opt" data-scope="recent">
        <b>最近 7 天</b><span>最多 30 题</span>
      </button>
      <button type="button" class="print-opt" data-scope="review">
        <b>今日复习</b><span id="printReviewCount">—</span>
      </button>
    </div>
    <div class="status hidden" id="printStatus">
      <span class="spinner"></span><span>生成中，题目多时需要几十秒…</span>
    </div>
    <div class="sheet-actions">
      <button id="printCancel" class="ghost">取消</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = {
  family: localStorage.getItem("family") || "C",
  qid: null,
  answer: 0,
  cands: [],
  sel: new Set(),   // qids ticked on the pick screen
  off: new Set(),   // qids the user unticked; every stage must respect them
  order: [],        // qids the viewer steps through, page order
  at: 0,
  source: "",       // where the open question came from, shown under the crop
  touched: false,   // the user edited the ticks; stop re-seeding them
  timer: null,
  picked: false,
  look: "home",     // last lookup screen, so the 查题 tab returns where you were
  file: null,       // photo taken this session, offered as an attachment
  recogFamily: null, // family the candidates were read under
  sheet: null,      // { qids, from, tags:Set, family } while the mark sheet is open
  book: {
    items: [],
    total: 0,
    stats: null,
    loading: false,
    pending: false,      // a filter changed while a request was in flight
    pendingReset: false,
    filters: { family: "", tag: "", chapter: "", status: "", days: 0 },
  },
  detail: null,
  detailAnswer: 0,
  importItems: [],
  meta: null,
  review: {
    session: null,
    overview: null,
    summary: null,
    tags: new Set(),
    shown: false,
    busy: false,
  },
};

const FAMILY_NAME = {
  C: "案例习题集",
  Z: "知识习题册",
  A: "案例真题",
  K: "知识真题",
  M: "案例模拟",
};

// Mirrors app/store.TAGS; /api/books returns the same map when reachable.
const TAG_LABELS = {
  concept: "不会",
  calc: "算错",
  standard: "规范错",
  misread: "审题错",
};

function tagLabel(key) {
  return (state.meta && state.meta.tags && state.meta.tags[key]) || TAG_LABELS[key] || key;
}

async function loadMeta() {
  if (state.meta) return state.meta;
  try {
    const res = await fetch("/api/books");
    if (res.ok) state.meta = await res.json();
  } catch (err) { /* offline: the built-in labels and no chapter list */ }
  return state.meta;
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function setFamily(f) {
  state.family = f;
  localStorage.setItem("family", f);
  $("family").value = f;
  $("familyName").textContent = FAMILY_NAME[f] || f;
}

const SCREENS = ["home", "pick", "viewer", "review", "summary", "book", "detail", "import"];
const LOOK_SCREENS = ["home", "pick", "viewer"];

function show(section) {
  for (const id of SCREENS) {
    $(id).classList.toggle("hidden", id !== section);
  }
  const look = LOOK_SCREENS.includes(section);
  const reviewish = section === "review" || section === "summary";
  if (look) state.look = section;
  $("navLook").classList.toggle("on", look);
  $("navBook").classList.toggle("on", !look && !reviewish);
  $("navReview").classList.toggle("on", reviewish);
  // The family picker belongs to the lookup flow only; the book has its own.
  $("family").classList.toggle("hidden", !look);
  window.scrollTo(0, 0);
}

$("navLook").addEventListener("click", () => show(state.look || "home"));
$("navBook").addEventListener("click", openBook);
$("navReview").addEventListener("click", startReview);
$("startReview").addEventListener("click", startReview);

$("family").addEventListener("change", (e) => {
  setFamily(e.target.value);
  closeViewer();
});

$("camera").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  e.target.value = "";
  await recognizeFile(file);
});

$("retry").addEventListener("click", () => {
  closeViewer();
  show("home");
});

// Back to the ticks, not all the way home: adjusting a mis-ticked question
// must not cost another photo.
$("back").addEventListener("click", () => {
  closeViewer();
  show(state.cands.length ? "pick" : "home");
});

$("again").addEventListener("click", () => {
  closeViewer();
  show("home");
});

for (const [btn, input] of [["go", "manual"], ["go2", "manual2"]]) {
  $(btn).addEventListener("click", () => openManual($(input).value));
  $(input).addEventListener("keydown", (e) => {
    if (e.key === "Enter") openManual($(input).value);
  });
}

async function recognizeFile(file) {
  show("pick");
  $("pickBody").classList.add("hidden");
  $("busy").classList.remove("hidden");
  $("busyText").textContent = "识别中…";
  state.picked = false;
  state.touched = false;   // a new photo starts from the seeded ticks
  state.sel = new Set();
  state.off = new Set();
  state.cands = [];
  state.file = file;   // offered as the attachment when marking a wrong answer
  // Candidate ids are bare ("3-11"); remember the book they were read under
  // so a later family switch cannot silently re-prefix them.
  state.recogFamily = state.family;
  if ($("preview")._url) URL.revokeObjectURL($("preview")._url);
  $("preview")._url = URL.createObjectURL(file);
  $("preview").src = $("preview")._url;

  const started = Date.now();
  state.timer = setInterval(() => {
    $("busyText").textContent = "识别中… " + ((Date.now() - started) / 1000).toFixed(0) + "s";
  }, 500);

  const fd = new FormData();
  fd.append("file", file);
  fd.append("family", state.family);

  try {
    const res = await fetch("/api/recognize", { method: "POST", body: fd });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    // The server streams one JSON object per stage: "head" arrives long
    // before "full", so candidates can show up while the scan continues.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffered = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffered += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffered.indexOf("\n")) >= 0) {
        const line = buffered.slice(0, cut).trim();
        buffered = buffered.slice(cut + 1);
        if (line) handleStage(JSON.parse(line));
      }
    }
    clearInterval(state.timer);
  } catch (err) {
    clearInterval(state.timer);
    $("busy").classList.add("hidden");
    $("pickBody").classList.remove("hidden");
    $("pickMeta").textContent = "识别失败：" + err.message;
    toast("识别失败，直接手输吧");
  }
}

function handleStage(data) {
  if (data.stage === "error") throw new Error(data.detail || "识别失败");
  renderCandidates(data, data.stage === "full");
}

function renderCandidates(data, final) {
  $("busy").classList.toggle("hidden", final);
  $("pickBody").classList.remove("hidden");
  state.cands = data.candidates || [];
  const cands = state.cands;
  $("busyText").textContent = "先给你 " + cands.length + " 个题号，继续找…";
  $("pickMeta").textContent = final
    ? cands.length
      ? "识别完成 " + data.seconds + "s · 点题号可勾选/取消"
      : "没认出题号，手输一下吧"
    : "先按已认出的勾，剩下的马上补";

  // A whole page is normally checked as a set, so every anchored read (a real
  // question label, not a loose guess) starts ticked.  This re-runs on every
  // stage: the head channel often misses a question the full scan finds, and
  // that one must still arrive ticked.  A question the user unticked stays
  // unticked -- `off` outranks the seed.
  for (const c of cands) {
    if (c.start && !state.off.has(c.qid)) state.sel.add(c.qid);
  }

  const box = $("candidates");
  box.innerHTML = "";
  // Candidates arrive in page order; with a single question the best-scoring
  // chip still gets a hint outline.
  const highlight = cands.reduce((a, c) => (!a || c.score > a.score ? c : a), null);
  const starts = cands.filter((c) => c.start);
  cands.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.qid = c.qid;
    b.className = "cand"
      + (state.sel.has(c.qid) ? " on" : "")
      + (c === highlight && starts.length <= 1 ? " top" : "");
    b.setAttribute("aria-pressed", state.sel.has(c.qid) ? "true" : "false");
    const ord = c.start ? "第" + (starts.indexOf(c) + 1) + "题 · " : "";
    b.innerHTML = '<span class="tick" aria-hidden="true">✓</span>'
      + "<b>" + escapeHtml(c.qid) + "</b><span>"
      + ord + Math.round(c.score * 100) + "%"
      + (c.start ? "" : ' · <em class="tag">待确认</em>')
      + "</span>";
    b.addEventListener("click", () => togglePick(c.qid));
    box.appendChild(b);
  });
  updateSelBar();

  // Warm the crop cache for the likeliest taps so opening one is instant.
  [...cands]
    .sort((a, b) => b.score - a.score)
    .slice(0, 2)
    .forEach((c) => prefetchCrop(c.qid));

  // The back end applies the one auto-open rule; the page never re-derives it.
  // Once the photo has been ticked or opened by hand, the final stage must not
  // yank the viewer somewhere else.
  if (final && data.auto && !state.picked && !state.touched) openViewer(data.auto, true);
}

function togglePick(qid) {
  state.touched = true;
  if (state.sel.has(qid)) {
    state.sel.delete(qid);
    state.off.add(qid);
  } else {
    state.sel.add(qid);
    state.off.delete(qid);
  }
  updateSelBar();
}

function updateSelBar() {
  const n = state.sel.size;
  $("openSel").textContent = n ? "查看所选 (" + n + ")" : "查看所选";
  $("openSel").disabled = !n;
  $("markSel").textContent = n ? "记错 (" + n + ")" : "记错";
  $("markSel").disabled = !n;
  for (const chip of $("candidates").querySelectorAll(".cand")) {
    const on = state.sel.has(chip.dataset.qid);
    chip.classList.toggle("on", on);
    chip.setAttribute("aria-pressed", on ? "true" : "false");
  }
}

$("selectAll").addEventListener("click", () => {
  state.touched = true;
  state.off.clear();
  state.sel = new Set(state.cands.filter((c) => c.start).map((c) => c.qid));
  updateSelBar();
});

$("clearSel").addEventListener("click", () => {
  state.touched = true;
  // Remember every untick, or the next stage would re-seed them.
  for (const qid of state.sel) state.off.add(qid);
  state.sel.clear();
  updateSelBar();
});

$("openSel").addEventListener("click", () => {
  // Page order first; anything ticked that the last stage dropped keeps its
  // tick and goes last rather than silently vanishing.
  const order = state.cands.filter((c) => state.sel.has(c.qid)).map((c) => c.qid);
  for (const qid of state.sel) {
    if (!order.includes(qid)) order.push(qid);
  }
  if (!order.length) {
    toast("先勾一题");
    return;
  }
  openSelection(order);
});

function prefetchCrop(qid) {
  if (!qid) return;
  const img = new Image();
  img.src = "/api/crop?qid=" + encodeURIComponent(qid)
    + "&family=" + state.family + "&answer=0";
}

async function openManual(value) {
  const qid = (value || "").trim();
  if (!qid) {
    toast("先写个题号");
    return;
  }
  await openViewer(qid);
}

async function openViewer(qid, auto) {
  if (!auto) state.picked = true; // a hand-picked qid outranks the auto rule
  state.order = [qid];
  state.at = 0;
  await showViewerAt(0, auto ? "已自动识别 " + qid + " · 不对就手输" : null);
}

async function openSelection(order) {
  state.picked = true;
  state.order = order;
  state.at = 0;
  await showViewerAt(0);
}

async function showViewerAt(index, note) {
  const qid = state.order[index];
  if (!qid) return;
  try {
    const res = await fetch(
      "/api/resolve?qid=" + encodeURIComponent(qid) + "&family=" + state.family
    );
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const info = await res.json();
    state.at = index;
    state.qid = info.qid;
    state.answer = 0;
    const batch = state.order.length > 1;
    $("qidTitle").textContent = info.qid;
    $("pos").textContent = batch ? (index + 1) + " / " + state.order.length : "";
    $("prev").classList.toggle("hidden", !batch);
    $("next").classList.toggle("hidden", !batch);
    $("again").classList.toggle("hidden", batch);
    $("prev").disabled = index <= 0;
    $("next").disabled = index >= state.order.length - 1;
    $("tabQ").classList.add("on");
    $("tabA").classList.remove("on");
    state.source = info.book
      ? info.book + (state.family === "Z" ? " · 知识册题目与答案同页" : "")
      : "";
    renderWrongBadge(info.attempt);
    show("viewer");
    await loadCrop();
    prefetchAround();
    if (note) toast(note);
  } catch (err) {
    toast(err.message);
  }
}

function prefetchAround() {
  for (const i of [state.at - 1, state.at + 1]) {
    if (state.order[i]) prefetchCrop(state.order[i]);
  }
}

function step(d) {
  const i = state.at + d;
  if (i >= 0 && i < state.order.length) showViewerAt(i);
}

$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));

document.addEventListener("keydown", (e) => {
  if ($("viewer").classList.contains("hidden") || state.order.length < 2) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

async function loadCrop() {
  if (!state.qid) return;
  $("viewerHint").textContent = (state.answer ? "解析裁图" : "题干裁图")
    + (state.source ? " · 来源：" + state.source : "");
  $("paper").src = "/api/crop?qid=" + encodeURIComponent(state.qid)
    + "&family=" + state.family + "&answer=" + state.answer;
}

$("tabQ").addEventListener("click", () => {
  state.answer = 0;
  $("tabQ").classList.add("on");
  $("tabA").classList.remove("on");
  loadCrop();
});
$("tabA").addEventListener("click", () => {
  state.answer = 1;
  $("tabA").classList.add("on");
  $("tabQ").classList.remove("on");
  loadCrop();
});
$("zoom").addEventListener("click", () => {
  const w = $("paperWrap");
  w.classList.toggle("zoom");
  $("zoom").textContent = w.classList.contains("zoom") ? "适应" : "放大";
  if (!w.classList.contains("zoom")) w.scrollLeft = 0;
});

function closeViewer() {
  state.qid = null;
  $("paper").removeAttribute("src");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// ---------------------------------------------------------------- wrong book

function renderWrongBadge(attempt) {
  const el = $("wrongBadge");
  if (!attempt) {
    el.classList.add("hidden");
    el.textContent = "";
    return;
  }
  el.textContent = "错 " + attempt.times + " 次"
    + (attempt.status === "mastered" ? " · 已掌握" : "");
  el.classList.remove("hidden");
}

async function refreshBadge(qid) {
  try {
    const res = await fetch(
      "/api/resolve?qid=" + encodeURIComponent(qid) + "&family=" + state.family
    );
    if (res.ok) renderWrongBadge((await res.json()).attempt);
  } catch (err) { /* the badge is a nicety; never block on it */ }
}

async function refreshNavCount() {
  try {
    const res = await fetch("/api/attempts?limit=1");
    if (res.ok) {
      const data = await res.json();
      const n = data.stats.total;
      $("navBook").textContent = n ? "错题本 " + n : "错题本";
    }
  } catch (err) { /* offline is fine */ }
  loadReviewToday();
}

// --- mark sheet -----------------------------------------------------------

function openSheet(qids, from) {
  if (!qids.length) {
    toast("先勾题");
    return;
  }
  state.sheet = {
    qids,
    from,
    tags: new Set(),
    family: state.recogFamily || state.family,
  };
  $("sheetCount").textContent = qids.length + " 题";
  const box = $("sheetTags");
  box.innerHTML = "";
  for (const key of Object.keys(TAG_LABELS)) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.dataset.tag = key;
    b.textContent = tagLabel(key);
    b.addEventListener("click", () => {
      if (state.sheet.tags.has(key)) state.sheet.tags.delete(key);
      else state.sheet.tags.add(key);
      b.classList.toggle("on", state.sheet.tags.has(key));
    });
    box.appendChild(b);
  }
  $("sheetNote").value = "";
  const canPhoto = !!state.file;
  $("sheetPhotoRow").classList.toggle("hidden", !canPhoto);
  $("sheetPhoto").checked = canPhoto;
  $("sheet").classList.remove("hidden");
}

function closeSheet() {
  $("sheet").classList.add("hidden");
  state.sheet = null;
}

async function uploadPhoto(file) {
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch("/api/photos", { method: "POST", body: fd });
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data.sha256;
}

async function saveSheet() {
  const sheet = state.sheet;
  if (!sheet) return;
  $("sheetSave").disabled = true;
  $("sheetSave").textContent = "保存中…";
  try {
    let photoSha = null;
    if (!$("sheetPhotoRow").classList.contains("hidden")
        && $("sheetPhoto").checked && state.file) {
      photoSha = await uploadPhoto(state.file);
    }
    const body = {
      qids: sheet.qids,
      family: sheet.family || state.family,
      tags: [...sheet.tags],
      source: sheet.from === "viewer" ? "single" : "batch",
    };
    const note = $("sheetNote").value.trim();
    if (note) body.note = note;
    if (photoSha) body.photo_sha = photoSha;
    const res = await fetch("/api/attempts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    const n = data.created.length + data.updated.length;
    toast(n ? "已记 " + n + " 题" : "没有记入新题");
    if (data.errors.length) {
      toast("有 " + data.errors.length + " 题没记上：" + data.errors[0].detail);
    }
    closeSheet();
    if (state.qid) refreshBadge(state.qid);
    refreshNavCount();
  } catch (err) {
    toast("保存失败：" + err.message);
  } finally {
    $("sheetSave").disabled = false;
    $("sheetSave").textContent = "保存";
  }
}

$("markSel").addEventListener("click", () => {
  const order = state.cands.filter((c) => state.sel.has(c.qid)).map((c) => c.qid);

// --- book list ------------------------------------------------------------

function bookQuery(offset) {
  const f = state.book.filters;
  const p = new URLSearchParams();
  if (f.family) p.set("family", f.family);
  if (f.tag) p.set("tag", f.tag);
  if (f.chapter) p.set("chapter", f.chapter);
  if (f.status) p.set("status", f.status);
  if (f.days) p.set("days", String(f.days));
  p.set("limit", "50");
  p.set("offset", String(offset));
  return p;
}

async function openBook() {
  show("book");
  await loadMeta();
  renderChapterFilter();
  await loadBook(true);
}

async function loadBook(reset) {
  // Taps can outrun the network; queue one follow-up instead of dropping it.
  if (state.book.loading) {
    state.book.pending = true;
    state.book.pendingReset = state.book.pendingReset || reset;
    return;
  }
  state.book.loading = true;
  const offset = reset ? 0 : state.book.items.length;
  try {
    const res = await fetch("/api/attempts?" + bookQuery(offset).toString());
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    state.book.items = reset ? data.items : state.book.items.concat(data.items);
    state.book.total = data.total;
    state.book.stats = data.stats;
    renderBook();
  } catch (err) {
    toast("加载错题本失败：" + err.message);
  } finally {
    state.book.loading = false;
    if (state.book.pending) {
      const againReset = state.book.pendingReset;
      state.book.pending = false;
      state.book.pendingReset = false;
      loadBook(againReset);
    }
  }
}

function renderTagFilters() {
  const box = $("fTags");
  const stats = state.book.stats;
  box.innerHTML = "";
  for (const key of Object.keys(TAG_LABELS)) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (state.book.filters.tag === key ? " on" : "");
    const count = stats ? (stats.by_tag[key] || 0) : "";
    b.innerHTML = escapeHtml(tagLabel(key))
      + (count === "" ? "" : ' <span class="n">' + count + "</span>");
    b.addEventListener("click", () => {
      state.book.filters.tag = state.book.filters.tag === key ? "" : key;
      loadBook(true);
    });
    box.appendChild(b);
  }
}

function renderChapterFilter() {
  const sel = $("fChapter");
  const f = state.book.filters;
  const showChapter = !f.family || f.family === "C";
  sel.classList.toggle("hidden", !showChapter);
  if (!showChapter) {
    f.chapter = "";
    return;
  }
  if (!sel.dataset.ready) {
    sel.innerHTML = '<option value="">全部篇</option>';
    for (const row of (state.meta && state.meta.chapters) || []) {
      const opt = document.createElement("option");
      opt.value = row.key;
      opt.textContent = row.title;
      sel.appendChild(opt);
    }
    sel.dataset.ready = "1";
  }
  sel.value = f.chapter;
}

function shortDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(0, 10);
  const pad = (n) => String(n).padStart(2, "0");
  const md = pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const now = new Date();
  return d.getFullYear() === now.getFullYear() ? md : d.getFullYear() + "-" + md;
}

function renderBook() {
  renderTagFilters();
  const stats = state.book.stats;
  $("bookMeta").textContent = "本次 " + state.book.total + " 题 · 全部 "
    + (stats ? stats.total : "—") + " 题 · 未掌握 "
    + (stats ? stats.active : "—") + " · 已掌握 "
    + (stats ? stats.mastered : "—");
  const list = $("bookList");
  list.innerHTML = "";
  if (!state.book.items.length) {
    list.innerHTML = '<div class="empty">'
      + (stats && stats.total
        ? "没有符合筛选条件的错题"
        : "错题本还是空的：拍照识别后点「记错」，或先导入旧照片")
      + "</div>";
  }
  for (const item of state.book.items) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "item" + (item.status === "mastered" ? " mastered" : "");
    const where = [item.chapter, item.section].filter(Boolean).join(" · ");
    const tags = item.tags
      .map((t) => '<span class="tagmini">' + escapeHtml(tagLabel(t)) + "</span>")
      .join("");
    btn.innerHTML =
      '<span class="main"><span class="qid">' + escapeHtml(item.qid) + "</span>"
      + tags
      + '<div class="meta">' + escapeHtml(where || item.family_name || "")
      + " · 错 " + item.times + " 次 · " + shortDate(item.last_at)
      + (item.status === "mastered"
        ? " · 已掌握"
        : (item.next_at ? " · 下次 " + shortDate(item.next_at) : ""))
      + "</div></span>"
      + (item.photo
        ? '<img class="mini" src="' + escapeHtml(item.photo.thumb) + '" alt="">'
        : "");
    btn.addEventListener("click", () => openDetail(item.id));
    list.appendChild(btn);
  }
  $("bookMore").classList.toggle(
    "hidden", state.book.items.length >= state.book.total
  );
}

$("fFamily").addEventListener("change", (e) => {
  state.book.filters.family = e.target.value;
  state.book.filters.chapter = "";
  renderChapterFilter();
  loadBook(true);
});
$("fChapter").addEventListener("change", (e) => {
  state.book.filters.chapter = e.target.value;
  loadBook(true);
});
$("fTime").addEventListener("change", (e) => {
  state.book.filters.days = Number(e.target.value) || 0;
  loadBook(true);
});
$("fStatus").addEventListener("change", (e) => {
  state.book.filters.status = e.target.value;
  loadBook(true);
});
$("bookMore").addEventListener("click", () => loadBook(false));

// --- detail ---------------------------------------------------------------

let suggestToken = 0;

function citationText(c) {
  let text = "《" + c.title + "》";
  if (c.code) text += " " + c.code;
  const nums = (c.clauses || []).filter((x) => !x.startsWith("附录"));
  const apps = (c.clauses || []).filter((x) => x.startsWith("附录"));
  if (nums.length) text += " 第" + nums.join("、") + "条";
  if (apps.length) text += " " + apps.join(" ");
  return text;
}

function syncSuggestChips() {
  for (const b of $("dSuggestBody").querySelectorAll("[data-suggest-tag]")) {
    const chip = $("dTags").querySelector('.chip[data-tag="' + b.dataset.suggestTag + '"]');
    b.classList.toggle("on", !!(chip && chip.classList.contains("on")));
  }
}

function renderSuggest(data) {
  const body = $("dSuggestBody");
  body.innerHTML = "";
  if (data.error) {
    $("dSuggestState").textContent = "没读出来";
    body.innerHTML = '<p class="suggest-note">' + escapeHtml(data.error) + "</p>";
    return;
  }
  $("dSuggestState").textContent = data.cached
    ? "来自缓存 · " + data.elapsed_ms + " ms"
    : "首次读取 " + (data.elapsed_ms / 1000).toFixed(1) + " s";
  if (data.citations.length) {
    const cites = document.createElement("div");
    cites.className = "suggest-cite";
    cites.innerHTML = "<b>依据</b><br>" + data.citations.slice(0, 4)
      .map((c) => escapeHtml(citationText(c))).join("<br>");
    body.appendChild(cites);
  }
  if (!data.candidates.length) {
    const note = document.createElement("p");
    note.className = "suggest-note";
    note.textContent = data.citations.length
      ? "解析里没找到明确的易错提示，按自己判断标注。"
      : "解析里没读到规范条文或易错提示。";
    body.appendChild(note);
    return;
  }
  const chips = document.createElement("div");
  chips.className = "chips";
  for (const cand of data.candidates) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.dataset.suggestTag = cand.tag;
    b.textContent = cand.label;
    b.title = cand.reason;
    b.addEventListener("click", () => {
      const chip = $("dTags").querySelector('.chip[data-tag="' + cand.tag + '"]');
      if (!chip) return;
      chip.classList.toggle("on");
      syncSuggestChips();
    });
    chips.appendChild(b);
  }
  body.appendChild(chips);
  const why = document.createElement("div");
  why.className = "suggest-evidence";
  for (const cand of data.candidates) {
    const line = document.createElement("div");
    line.innerHTML = "<b>" + escapeHtml(cand.label) + "</b> " + escapeHtml(cand.reason);
    why.appendChild(line);
  }
  body.appendChild(why);
  const tip = document.createElement("p");
  tip.className = "suggest-note";
  tip.textContent = "点候选 = 勾选对应错因，保存后生效。";
  body.appendChild(tip);
  syncSuggestChips();
}

async function loadSuggest(attemptId) {
  const token = ++suggestToken;
  $("dSuggestBody").innerHTML = "";
  $("dSuggestState").textContent = "读取解析中…（首次 3–6 秒）";
  try {
    const res = await fetch("/api/attempts/" + attemptId + "/suggest");
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    if (token !== suggestToken) return;
    if (!state.detail || state.detail.id !== attemptId) return;
    renderSuggest(data);
  } catch (err) {
    if (token !== suggestToken) return;
    $("dSuggestState").textContent = "没读出来";
    $("dSuggestBody").innerHTML =
      '<p class="suggest-note">' + escapeHtml(err.message) + "</p>";
  }
}

async function openDetail(id) {
  try {
    const res = await fetch("/api/attempts/" + id);
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    state.detail = data;
    state.detailAnswer = 0;
    renderDetail();
    show("detail");
    loadSuggest(data.id);
  } catch (err) {
    toast("打开失败：" + err.message);
  }
}

function renderDetail() {
  const d = state.detail;
  if (!d) return;
  $("dQid").textContent = d.qid;
  $("dTimes").textContent = "错 " + d.times + " 次";
  $("dWhere").textContent = [d.chapter, d.section, d.book]
    .filter(Boolean).join(" · ");
  $("dSchedule").textContent = d.status === "mastered"
    ? "已掌握 · 连续两次做对且间隔 ≥7 天"
    : "下次复习 " + shortDate(d.next_at)
      + " · 连续做对 " + (d.streak || 0) + " 次 · 错 " + d.times + " 次"
      + (d.stuck ? " · 顽固题（建议回书/规范）" : "");
  $("dTabQ").classList.toggle("on", state.detailAnswer === 0);
  $("dTabA").classList.toggle("on", state.detailAnswer === 1);
  $("dPaper").src = "/api/crop?qid=" + encodeURIComponent(d.qid)
    + "&family=" + d.family + "&answer=" + state.detailAnswer;
  if (d.photo) {
    $("dPhotoWrap").classList.remove("hidden");
    $("dPhoto").src = d.photo.orig;
  } else {
    $("dPhotoWrap").classList.add("hidden");
    $("dPhoto").removeAttribute("src");
  }
  const box = $("dTags");
  box.innerHTML = "";
  for (const key of Object.keys(TAG_LABELS)) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (d.tags.includes(key) ? " on" : "");
    b.dataset.tag = key;
    b.textContent = tagLabel(key);
    b.addEventListener("click", () => {
      b.classList.toggle("on");
      syncSuggestChips();
    });
    box.appendChild(b);
  }
  $("dNote").value = d.note || "";
  $("dMaster").textContent = d.status === "mastered" ? "恢复未掌握" : "标记已掌握";
  $("dMaster").dataset.next = d.status === "mastered" ? "active" : "mastered";
  syncSuggestChips();
}

$("dTabQ").addEventListener("click", () => {
  state.detailAnswer = 0;
  if (state.detail) renderDetail();
});
$("dTabA").addEventListener("click", () => {
  state.detailAnswer = 1;
  if (state.detail) renderDetail();
});

$("detailBack").addEventListener("click", () => {
  show("book");
  loadBook(true);
});

$("dSave").addEventListener("click", async () => {
  const d = state.detail;
  if (!d) return;
  const tags = [...$("dTags").querySelectorAll(".chip.on")].map((c) => c.dataset.tag);
  $("dSave").disabled = true;
  try {
    const res = await fetch("/api/attempts/" + d.id, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tags, note: $("dNote").value }),
    });

    if (!res.ok) throw new Error(data.detail || res.statusText);
    state.detail = data;

    toast("保存失败：" + err.message);

$("dMaster").addEventListener("click", async () => {
  const d = state.detail;
  if (!d) return;
  const next = $("dMaster").dataset.next === "mastered" ? "mastered" : "active";
  try {
    const res = await fetch("/api/attempts/" + d.id, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: next }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    state.detail = data;
    renderDetail();
    toast(next === "mastered" ? "已标记掌握" : "已放回未掌握");
    refreshNavCount();
  } catch (err) {
    toast("操作失败：" + err.message);
  }
});

$("dDelete").addEventListener("click", async () => {
  const d = state.detail;
  if (!d) return;
  if (!confirm("删除 " + d.qid + " 这条错题记录？")) return;
  try {
    const res = await fetch("/api/attempts/" + d.id, { method: "DELETE" });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    toast("已删除");
    state.detail = null;
    show("book");
    loadBook(true);
    refreshNavCount();
  } catch (err) {
    toast("删除失败：" + err.message);
  }
});

// --- review ---------------------------------------------------------------

function cropUrl(qid, answer, mask) {
  return "/api/crop?qid=" + encodeURIComponent(qid)
    + "&family=" + encodeURIComponent((qid || "C")[0])
    + "&answer=" + (answer ? 1 : 0)
    + "&mask=" + (mask ? 1 : 0);
}

function currentReviewItem() {
  const s = state.review.session;
  if (!s || !s.queue || s.cursor >= s.queue.length) return null;
  const qid = s.queue[s.cursor];
  return (s.items || []).find((item) => item.qid === qid) || null;
}

async function loadReviewToday() {
  try {
    const res = await fetch("/api/review/today");
    if (!res.ok) return;
    const data = await res.json();
    state.review.overview = data;
    renderReviewCta(data);
  } catch (err) { /* offline: the tab still works once reachable */ }
}

function renderReviewCta(data) {
  const s = data.session;
  const title = $("reviewCtaTitle");
  const hint = $("reviewCtaHint");
  $("navReview").textContent = data.count ? "复习 " + data.count : "复习";
  if (s && s.id && s.finished && !data.count) {
    title.textContent = "今日已完成 · 看总结";
    hint.textContent = "完成 " + s.graded_count + " / " + s.count
      + " 题 · 点开看数据与下一步";
    return;
  }
  if (s && s.id && !s.finished) {
    title.textContent = "继续复习 (" + s.cursor + "/" + s.count + ")";
    hint.textContent = "还剩 " + Math.max(0, s.count - s.cursor) + " 题 · 进度已保存";
    return;
  }
  if (data.count) {
    const r = data.reasons || {};
    title.textContent = "今日复习 (" + data.count + ")";
    hint.textContent = "预计 " + data.est_minutes + " 分钟 · 到期 "
      + (r.due || 0) + " · 新错 " + (r.new || 0) + " · 顽固 " + (r.stuck || 0);
    return;
  }
  const stats = data.stats || {};
  title.textContent = "今日复习";
  hint.textContent = "今天没有到期错题 · 全部 " + (stats.total ?? "—")
    + " 题 · 已掌握 " + (stats.mastered ?? "—");
}

async function startReview() {
  const overview = state.review.overview;
  const active = overview && overview.session;
  if (active && active.id && active.finished && !overview.count) {
    showSummary(active.id);
    return;
  }
  try {
    const res = await fetch("/api/review/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    if (!data.queue || !data.queue.length) {
      toast("今天没有到期错题");
      loadReviewToday();
      show("home");
      return;
    }
    if (data.finished) {
      showSummary(data.id);
      return;
    }
    state.review.session = data;
    state.review.summary = null;
    renderReview();
  } catch (err) {
    toast("打开复习失败：" + err.message);
  }
}

function renderReviewTags() {
  const box = $("rTagBox");
  box.innerHTML = '<span class="hint" style="align-self:center">错因（可选）</span>';
  for (const key of Object.keys(TAG_LABELS)) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.dataset.tag = key;
    b.textContent = tagLabel(key);
    b.addEventListener("click", () => {
      if (state.review.tags.has(key)) state.review.tags.delete(key);
      else state.review.tags.add(key);
      b.classList.toggle("on", state.review.tags.has(key));
    });
    box.appendChild(b);
  }
}

function renderReview() {
  const s = state.review.session;
  if (!s || !s.queue || !s.queue.length) {
    show("home");
    return;
  }
  if (s.cursor >= s.queue.length) {
    showSummary(s.id);
    return;
  }
  const item = currentReviewItem();
  if (!item) {
    // The question was deleted after the queue was frozen; skip it quietly.
    skipReview(true);
    return;
  }
  state.review.shown = false;
  state.review.tags = new Set();
  for (const chip of $("rTagBox").querySelectorAll(".chip")) {
    chip.classList.remove("on");
  }
  $("rQid").textContent = item.qid;
  $("rPos").textContent = (s.cursor + 1) + " / " + s.count;
  const where = [item.chapter, item.section, item.book].filter(Boolean).join(" · ");
  $("rWhere").textContent = where + " · 错 " + item.times + " 次"
    + (item.stuck ? " · 顽固题" : "");
  $("rHint").textContent = "先自己做一遍，再点「看答案」。";
  const paper = $("rPaper");
  paper.onerror = () => {
    $("rHint").textContent = "题面加载失败（答案遮罩不可用）。点「跳过」继续，不会记分。";
    $("rShowAnswer").classList.add("hidden");
    $("rWrong").classList.add("hidden");
    $("rRight").classList.add("hidden");
  };
  paper.src = cropUrl(item.qid, false, true);
  const answer = $("rAnswer");
  answer.onerror = null;
  answer.removeAttribute("src");
  $("rAnswerWrap").classList.add("hidden");
  $("rTagBox").classList.add("hidden");
  $("rShowAnswer").classList.remove("hidden");
  $("rShowAnswer").disabled = false;
  $("rWrong").classList.add("hidden");
  $("rRight").classList.add("hidden");
  $("rWrong").disabled = false;
  $("rRight").disabled = false;
  $("rUndo").disabled = (s.graded_count || 0) === 0;
  $("rPos").textContent = (s.cursor + 1) + " / " + s.count;
  show("review");
  const nextQid = s.queue[s.cursor + 1];
  if (nextQid) new Image().src = cropUrl(nextQid, false, true);
}

function showReviewAnswer() {
  const item = currentReviewItem();
  if (!item) return;
  const answer = $("rAnswer");
  answer.onerror = () => {
    $("rAnswerWrap").classList.add("hidden");
    $("rShowAnswer").classList.add("hidden");
    $("rWrong").classList.add("hidden");
    $("rRight").classList.add("hidden");
    $("rHint").textContent = "这题的答案遮罩失败，先跳过（不会记分）。";
  };
  answer.src = cropUrl(item.qid, true, true);
  $("rAnswerWrap").classList.remove("hidden");
  $("rShowAnswer").classList.add("hidden");
  $("rWrong").classList.remove("hidden");
  $("rRight").classList.remove("hidden");
  $("rTagBox").classList.remove("hidden");
  $("rHint").textContent = "看完答案选一个评分，自动进入下一题。标签可不选。";
  state.review.shown = true;
  answer.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function nextReviewStep(session, fallbackId) {
  if (session.finished || session.cursor >= session.queue.length) {
    showSummary(session.id || fallbackId);
  } else {
    renderReview();
  }
}

async function gradeReview(result) {
  const r = state.review;
  if (r.busy) return;
  const s = r.session;
  const item = currentReviewItem();
  if (!s || !item) return;
  r.busy = true;
  $("rWrong").disabled = true;
  $("rRight").disabled = true;
  try {
    const body = { session_id: s.id, qid: item.qid, result };
    if (result === "wrong" && r.tags.size) body.tags = [...r.tags];
    const res = await fetch("/api/review/grade", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    r.session = data.session;
    const attempt = data.attempt || {};
    if (result === "correct") {
      toast(attempt.status === "mastered"
        ? "已掌握 · 连续两次做对且间隔 ≥7 天"
        : "做对了 · " + attempt.interval_days + " 天后再见");
    } else {
      toast("记下 · " + attempt.interval_days + " 天后再练"
        + (attempt.stuck ? " · 已标顽固" : ""));
    }
    refreshNavCount();
    nextReviewStep(r.session, s.id);
  } catch (err) {
    toast("记录失败：" + err.message);
  } finally {
    r.busy = false;
    $("rWrong").disabled = false;
    $("rRight").disabled = false;
  }
}

async function skipReview(auto) {
  const r = state.review;
  const s = r.session;
  if (!s || !s.id) return;
  const item = currentReviewItem();
  if (!auto && !confirm("跳过这题？本轮不会再出现。")) return;
  const qid = item ? item.qid : s.queue[s.cursor];
  try {
    const res = await fetch("/api/review/skip", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: s.id, qid }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    r.session = data;
    if (!auto) toast("已跳过");
    nextReviewStep(data, s.id);
  } catch (err) {
    toast("跳过失败：" + err.message);
  }
}

async function undoReview() {
  const s = state.review.session;
  if (!s || !s.id) return;
  try {
    const res = await fetch("/api/review/undo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: s.id }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    state.review.session = data.session;
    toast("已撤销 " + data.undone);
    renderReview();
  } catch (err) {
    toast(err.message || "没有可撤销的评分");
  }
}

function exitReview() {
  show("home");
  refreshNavCount();
}

function showSummary(sessionId) {
  fetch("/api/review/summary?session_id=" + encodeURIComponent(sessionId))
    .then(async (res) => {
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      state.review.summary = data;
      renderSummary(data);
      show("summary");
      loadReviewToday();
    })
    .catch((err) => toast("总结加载失败：" + err.message));
}

function renderSummary(data) {
  $("sDay").textContent = data.day || "";
  $("sDone").textContent = data.graded;
  $("sCorrect").textContent = data.correct;
  $("sWrong").textContent = data.wrong;
  $("sAccuracy").textContent = data.graded
    ? Math.round(data.accuracy * 100) + "%" : "—";
  $("sMinutes").textContent = data.graded
    ? Math.max(1, Math.round(data.duration / 60)) : 0;
  $("sSkipped").textContent = data.skipped;

  const mastered = data.mastered_items || [];
  const masterBox = $("sMastered");
  if (mastered.length) {
    masterBox.classList.remove("hidden");
    masterBox.innerHTML = "<h3>新掌握</h3><p>"
      + mastered.map((m) => escapeHtml(m.qid)).join("、")
      + " · 连续两次做对且间隔 ≥7 天，可以划掉。</p>";
  } else {
    masterBox.classList.add("hidden");
  }

  const stubborn = data.stubborn || [];
  const stubbornBox = $("sStubborn");
  if (stubborn.length) {
    stubbornBox.classList.remove("hidden");
    stubbornBox.innerHTML = "<h3>顽固题（错 ≥3 次）</h3><p>"
      + stubborn.map((s) => escapeHtml(s.qid) + " 错 " + s.times + " 次").join("；")
      + " · 建议先回书/规范看概念，不再机械刷。</p>";
  } else {
    stubbornBox.classList.add("hidden");
  }

  let next;
  if (stubborn.length) {
    next = "先回书/规范看 " + stubborn[0].qid + "（错 " + stubborn[0].times + " 次）"
      + (data.next_due
        ? "；下次复习 " + shortDate(data.next_due) + "，共 " + data.next_due_count + " 题。"
        : "；看完回来标记掌握。");
  } else if (data.next_due) {
    next = shortDate(data.next_due) + " 再复习 " + data.next_due_count
      + " 题，已经自动排好，不用手动记。";
  } else {
    next = "今天没有更多到期题；保持节奏，明天再来。";
  }
  $("sNext").textContent = next;

  let encourage;
  if (mastered.length) {
    encourage = mastered.map((m) => m.qid).join("、")
      + " 连续两次做对、间隔 ≥7 天，正式算掌握——这是能真正划掉的题。";
  } else if ((data.recovered_count || 0) >= 2) {
    encourage = data.recovered_count + " 道题从上次做错后第一次做对，说明回看的点在起作用。";
  } else if (data.graded >= 3 && data.accuracy === 1) {
    encourage = data.graded + " 题全对，而且都是先自己做再看答案，不是背答案。";
  } else if (data.correct > 0) {
    encourage = data.correct + "/" + data.graded + " 做对；错的 "
      + data.wrong + " 道已按错题排进后面几天的复习，不会漏。";
  } else if (data.wrong > 0) {
    encourage = "今天 " + data.wrong
      + " 道全错，但每道都定位到了具体题号和日期——比留在书里没整理强。";
  } else {
    encourage = "今天还没有评分记录。休息一下，明天从到期题开始。";
  }
  $("sEncourage").textContent = encourage;

  const again = $("sAgain");
  again.classList.toggle("hidden", !(data.queue_now > 0));
}

$("rShowAnswer").addEventListener("click", showReviewAnswer);
$("rWrong").addEventListener("click", () => gradeReview("wrong"));
$("rRight").addEventListener("click", () => gradeReview("correct"));
$("rSkip").addEventListener("click", () => skipReview(false));
$("rUndo").addEventListener("click", undoReview);
$("rExit").addEventListener("click", exitReview);
$("sHome").addEventListener("click", () => {
  show("home");
  refreshNavCount();
});
$("sAgain").addEventListener("click", startReview);
$("sPrint").addEventListener("click", () => downloadPrint("review"));

document.addEventListener("keydown", (e) => {
  if ($("review").classList.contains("hidden")) return;
  if (e.key === " ") {
    e.preventDefault();
    if (!state.review.shown) showReviewAnswer();
    return;
  }
  if (e.key.toLowerCase() === "u") {
    undoReview();
    return;
  }
  if (!state.review.shown) return;
  if (e.key === "1") {
    e.preventDefault();
    gradeReview("wrong");
  } else if (e.key === "2") {
    e.preventDefault();
    gradeReview("correct");
  }
});

let reviewTouch = null;
$("review").addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    reviewTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}, { passive: true });
$("review").addEventListener("touchend", (e) => {
  if (!reviewTouch || !state.review.shown) {
    reviewTouch = null;
    return;
  }
  const t = e.changedTouches[0];
  const dx = t.clientX - reviewTouch.x;
  const dy = t.clientY - reviewTouch.y;
  reviewTouch = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  gradeReview(dx > 0 ? "correct" : "wrong");
}, { passive: true });

// --- print ----------------------------------------------------------------

function openPrintSheet() {
  $("printFilterCount").textContent = state.book.total
    ? state.book.total + " 题（最多 30）" : "—";
  const overview = state.review.overview;
  $("printReviewCount").textContent = overview
    ? (overview.count ? overview.count + " 题" : "今天没有到期题")
    : "—";
  $("printStatus").classList.add("hidden");
  $("printSheet").classList.remove("hidden");
}

function closePrintSheet() {
  $("printSheet").classList.add("hidden");
}

async function downloadPrint(scope) {
  const q = new URLSearchParams({ scope });
  if (scope === "filter") {
    const f = state.book.filters;
    if (f.family) q.set("family", f.family);
    if (f.tag) q.set("tag", f.tag);
    if (f.chapter) q.set("chapter", f.chapter);
    q.set("status", f.status || "");
    if (f.days) q.set("days", String(f.days));
  }
  if (scope === "review" && state.review.summary) {
    q.set("session_id", String(state.review.summary.session_id));
  }
  const status = $("printStatus");
  const buttons = [...$("printSheet").querySelectorAll(".print-opt")];
  status.classList.remove("hidden");
  for (const b of buttons) b.disabled = true;
  try {
    const res = await fetch("/api/print?" + q.toString());
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (err) { /* pdf error */ }
      throw new Error(detail);
    }
    const blob = await res.blob();
    let stats = {};
    try { stats = JSON.parse(res.headers.get("X-Print-Stats") || "{}"); } catch (err) { /* header is a nicety */ }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "错题打印卷.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(stats.pages
      ? "已生成 " + stats.pages + " 页（题面 " + stats.question_pages
        + " + 答案 " + stats.answer_pages + "）"
      : "已生成打印卷");
    closePrintSheet();
  } catch (err) {
    toast("生成失败：" + err.message);
  } finally {
    status.classList.add("hidden");
    for (const b of buttons) b.disabled = false;
  }
}

$("openPrint").addEventListener("click", openPrintSheet);
$("printCancel").addEventListener("click", closePrintSheet);
$("printSheet").addEventListener("click", (e) => {
  if (e.target === $("printSheet")) closePrintSheet();
});
for (const button of $("printSheet").querySelectorAll(".print-opt")) {
  button.addEventListener("click", () => downloadPrint(button.dataset.scope));
}

$("openImport").addEventListener("click", openImport);
$("importBack").addEventListener("click", () => {
  show("book");
  loadBook(true);
});

async function openImport() {
  show("import");
  $("importHint").textContent = "扫描 拍照错题/ …";
  $("importList").innerHTML =
    '<div class="status"><span class="spinner"></span>处理照片中，第一次会慢一些…</div>';
  try {
    const res = await fetch("/api/import/preview?family=C");
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    state.importItems = data.items;
    $("importHint").textContent = "共 " + data.items.length
      + " 张照片，可新增 " + data.new + " 题；已在错题本的题会自动跳过。";
    renderImport();
  } catch (err) {
    $("importHint").textContent = "扫描失败：" + err.message;
    $("importList").innerHTML = "";
  }
}

function renderImport() {
  const box = $("importList");
  box.innerHTML = "";
  for (const item of state.importItems) {
    const row = document.createElement("label");
    row.className = "import-row";
    const qids = item.qids.map((q) => {
      const text = q.status === "new" ? "新" : q.status === "dup" ? "已在库" : "题库无此号";
      const cls = q.status === "new" ? "ok" : "warn";
      return escapeHtml(q.qid) + '( <span class="' + cls + '">' + text + "</span> )";
    }).join("　");
    row.innerHTML =
      '<input type="checkbox" ' + (item.new_count > 0 ? "checked" : "")
      + ' data-sha="' + escapeHtml(item.sha256 || "") + '">'
      + (item.thumb
        ? '<img class="mini" src="' + escapeHtml(item.thumb) + '" alt="">'
        : "")
      + '<span class="main"><div>'
      + (qids || escapeHtml(item.error || "文件里没有题号"))
      + '</div><div class="name">' + escapeHtml(item.file) + "</div></span>";
    box.appendChild(row);
  }
}

$("importAll").addEventListener("click", () => {
  const boxes = [...$("importList").querySelectorAll("input[type=checkbox]")];
  const allOn = boxes.length && boxes.every((b) => b.checked);
  for (const b of boxes) b.checked = !allOn;
});

$("importGo").addEventListener("click", async () => {
  const shas = [...$("importList").querySelectorAll("input[type=checkbox]:checked")]
    .map((c) => c.dataset.sha)
    .filter(Boolean);
  if (!shas.length) {
    toast("先勾选要导入的照片");
    return;
  }
  $("importGo").disabled = true;
  try {
    const res = await fetch("/api/import", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ shas, family: "C" }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    toast(data.created.length
      ? "导入完成：新增 " + data.created.length + " 题"
      : "没有新题可导入");
    refreshNavCount();
    show("book");
    loadBook(true);
  } catch (err) {
    toast("导入失败：" + err.message);
  } finally {
    $("importGo").disabled = false;
  }
});

setFamily(state.family);
renderReviewTags();
show("home");
loadMeta();
refreshNavCount();

// Deep link: /?qid=3-11 opens the viewer directly.

if (deep) openViewer(deep);
